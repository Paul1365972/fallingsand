[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustdocflags = ["-Clinker=rust-lld.exe"]

[target.wasm32-unknown-unknown]
rustflags = [
    '--cfg',
    'getrandom_backend="wasm_js"',
    '--cfg=web_sys_unstable_apis',
]

[env]
BEVY_ASSET_ROOT = { value = "", relative = true }

[alias]
dev = "run -p fallingsand_client"
dev-server = "run -p fallingsand_dedicated"
profile = "run -p fallingsand_client --release --no-default-features --features tracy"
profile-server = "run -p fallingsand_dedicated --release --features tracy"
dist = "build --profile dist --no-default-features --locked -p fallingsand_client -p fallingsand_dedicated"
